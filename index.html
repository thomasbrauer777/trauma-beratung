<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trauma Beratung – Severine Bräuer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f9fa;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333333;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 100%;
    }

    /* Klickbares Bild zu WhatsApp */
    .image-link {
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border-radius: 8px;
    }

    .image-link:hover {
      transform: scale(1.01);
    }

    img {
      max-width: 100%;
      max-height: 75vh;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: block;
    }

    .contact-container {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .info-text {
      font-size: 0.95rem;
      color: #666666;
      margin-bottom: 2px;
    }

    /* Klickbare E-Mail Adresse */
    .mail-link {
      font-size: 1.1rem;
      color: #0066cc;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.3px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .mail-link:hover {
      color: #004499;
      background-color: rgba(0, 102, 204, 0.08);
      text-decoration: underline;
    }

    /* WhatsApp Link / Button */
    .whatsapp-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
      transition: background-color 0.2s ease, transform 0.2s ease;
      margin-top: 4px;
    }

    .whatsapp-link:hover {
      background-color: #20ba59;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Klick aufs Bild -> WhatsApp -->
    <a href="https://wa.me/41791014280?text=Hallo%20Severine,%20ich%20interessiere%20mich%20f%C3%BCr%20eine%20Beratung." 
       target="_blank" 
       rel="noopener noreferrer" 
       class="image-link" 
       title="Per WhatsApp kontaktieren">
      <img src="PHOTO-2026-08-16-20-45-16.jpg" alt="Trauma Beratung – Severine Bräuer">
    </a>

    <!-- Bereich unter dem Bild -->
    <div class="contact-container">
      <div class="info-text">Für Terminanfragen und Erstgespräche erreichen Sie mich gerne per WhatsApp oder E-Mail:</div>

      <a href="mailto:praxis@trauma-beratung.ch" class="mail-link" title="E-Mail schreiben">
        praxis@trauma-beratung.ch
      </a>

      <a href="https://wa.me/41791014280?text=Hallo%20Severine,%20ich%20interessiere%20mich%20f%C3%BCr%20eine%20Beratung." 
         target="_blank" 
         rel="noopener noreferrer" 
         class="whatsapp-link" 
         title="Per WhatsApp schreiben">
        WhatsApp: 079 101 42 80
      </a>
    </div>
  </div>

</body>
</html>
