<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trauma Beratung – Severine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f9fa; /* Dezenter neutraler Hintergrund */
      padding: 20px;
    }

    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 100%;
      max-height: 100vh;
    }

    img {
      max-width: 100%;
      max-height: 90vh; /* Verhindert Scrollbalken auf Desktop-Bildschirmen */
      height: auto;
      object-fit: contain;
      border-radius: 8px; /* Leicht abgerundete Ecken (optional) */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* Sanfter Schatten für mehr Tiefe */
    }
  </style>
</head>
<body>

  <div class="image-container">
    <!-- Ersetze 'foto.jpg' durch den genauen Dateinamen deines Bildes im GitHub-Repository -->
    <img src="PHOTO-2026-08-16-20-45-16.jpg" alt="Trauma Beratung Severine">
  </div>

</body>
</html>
